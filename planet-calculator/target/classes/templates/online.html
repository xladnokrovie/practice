<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Карта Солнечной системы</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: black;
            color: #eee;
        }
        h1 { color: #e94560; text-align: center; }
        .nav {
            margin-bottom: 20px;
        }
        .nav a {
            color: #a0a0b0;
            text-decoration: none;
        }
        .nav a:hover {
            color: #e94560;
        }
        .map-container {
            width: 100%;
            height: 70vh;
            border: 2px solid #333;
            border-radius: 10px;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<div class="nav">
    <a href="/planets">← Назад к расчётам</a>
</div>

<h1>Интерактивная карта Солнечной системы</h1>
<p style="text-align: center; color: #a0a0b0;">
    Данные с theplanetstoday.com
</p>

<div class="map-container">
    <iframe src="https://www.theplanetstoday.com/the_planets.html"></iframe>
</div>

</body>
</html>
